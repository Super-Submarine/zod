<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A playful hello to the world, built with plain HTML, CSS, and JavaScript."
    />
    <title>Hello, World!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#" aria-label="Hello World home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>Hello.</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme">
        <span aria-hidden="true">☼</span>
      </button>
    </header>

    <main>
      <section class="hero" aria-labelledby="greeting">
        <p class="eyebrow"><span></span> A tiny website with a big welcome</p>
        <h1 id="greeting">Hello,<br /><em>World!</em></h1>
        <p class="intro">
          A simple corner of the internet made to say hello. No clutter, no fuss—just a warm welcome from this screen
          to yours.
        </p>
        <div class="actions">
          <button class="primary-button" type="button" id="say-hello">
            Say hello
            <span aria-hidden="true">↗</span>
          </button>
          <span class="status" aria-live="polite">Ready when you are.</span>
        </div>
      </section>

      <aside class="hello-card" aria-label="Greeting card">
        <div class="card-top">
          <span>MESSAGE 001</span>
          <span class="online"><i></i> ONLINE</span>
        </div>
        <div class="smile" aria-hidden="true">
          <span class="eye"></span>
          <span class="eye"></span>
          <span class="mouth"></span>
        </div>
        <div class="card-copy">
          <p>FROM</p>
          <strong>The Internet</strong>
          <p>TO</p>
          <strong>You, wherever you are</strong>
        </div>
      </aside>
    </main>

    <footer>
      <span>Made with curiosity</span>
      <span>© <span id="year"></span></span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
